<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes API Dashboard</h1>
    <p>Connected to JSONPlaceholder REST API</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Create a Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title (Required, max 100 chars)</label>
          <input type="text" id="title-input" placeholder="Note title..." required maxlength="100">
        </div>

        <div class="form-group">
          <label for="body-input">Body (Optional)</label>
          <textarea id="body-input" placeholder="Type your note content here..." rows="4"></textarea>
        </div>

        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>Server Notes</h2>
        <button type="button" id="load-btn">Load Notes</button>
      </div>

      <p id="status" class="status-message" aria-live="polite"></p>

      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
